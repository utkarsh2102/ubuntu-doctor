[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-doctor"
version = "0.1"
description = "Diagnose Ubuntu system problems with a local LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Utkarsh Gupta", email = "utkarsh@ubuntu.com" },
    { name = "Oliver Reiche", email = "oliver.reiche@gmail.com" },
]
keywords = [
    "ubuntu",
    "diagnostics",
    "sysadmin",
    "journald",
    "apt",
    "apparmor",
    "snap",
    "llm",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
publish = [
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/utkarsh2102/ubuntu-doctor"
Repository = "https://github.com/utkarsh2102/ubuntu-doctor"
Issues = "https://github.com/utkarsh2102/ubuntu-doctor/issues"

[project.scripts]
ubuntu-doctor = "ubuntu_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_doctor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ubuntu_doctor",
    "tests",
    "docs",
    "demo",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
